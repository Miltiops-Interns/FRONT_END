services:
  backend:
    build:
      context: ./backend

      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET:-development-secret-change-me}
      - MONGO_URI=${MONGO_URI:-}
    ports:
      - "5000:5000"
    # If you want logs with timestamps:
    # environment:
    #   - DEBUG=*

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    env_file:
      - .env.development
    depends_on:
      - backend
    ports:
      - "3000:80"
