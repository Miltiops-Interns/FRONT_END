<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c5a572;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b7355;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#goldGrad)" stroke="#1b2b44" stroke-width="2"/>
  
  <!-- Chef Hat -->
  <ellipse cx="50" cy="25" rx="20" ry="8" fill="#fff"/>
  <rect x="35" y="25" width="30" height="12" fill="#fff"/>
  <path d="M 30 37 Q 35 35 40 37 L 60 37 Q 65 35 70 37" stroke="#1b2b44" stroke-width="1.5" fill="none"/>
  
  <!-- Plate/Bowl -->
  <ellipse cx="50" cy="58" rx="28" ry="6" fill="#fff" opacity="0.95"/>
  <path d="M 22 58 Q 22 53 27 51 Q 32 49 50 49 Q 68 49 73 51 Q 78 53 78 58" 
        fill="none" stroke="#1b2b44" stroke-width="2"/>
  
  <!-- Food (curry/rice) -->
  <circle cx="45" cy="55" r="4" fill="#ff6b35"/>
  <circle cx="55" cy="55" r="4" fill="#ff6b35"/>
  <circle cx="50" cy="60" r="3" fill="#ffa500"/>
  
  <!-- Steam rising from food -->
  <path d="M 42 50 Q 40 45 38 40" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 50 48 Q 50 43 50 38" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 58 50 Q 60 45 62 40" stroke="#fff" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Small decorative elements -->
  <circle cx="50" cy="72" r="2" fill="#1b2b44"/>
</svg>
